<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="color-scheme" content="light dark" />
    <title>Nota</title>
    <script>
      // Appearance before the first paint (packages/app/src/theme/store.ts
      // takes over once the app runs; the keys are the landing page's too).
      (function () {
        var d = document.documentElement;
        var t = null;
        var p = null;
        try {
          t = localStorage.getItem("nota:theme");
          p = localStorage.getItem("nota:palette");
        } catch (e) {}
        if (t === "light" || t === "dark") d.dataset.theme = t;
        else t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        d.dataset.mode = t;
        // "jade" is the default palette now (store.ts, RENAMED_PALETTES).
        if (p === "jade") p = "nota";
        d.dataset.palette = p && /^[a-z0-9][a-z0-9.-]*$/.test(p) ? p : "nota";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
