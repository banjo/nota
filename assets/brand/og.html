<!doctype html>

<html lang="en">

      font-family: "Inter";
      src: url("../../apps/landing/public/fonts/inter-latin.woff2") format("woff2");

    * {
      box-sizing: border-box;
      margin: 0;
    }
    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }
    body {
      background: #f7f7f5;
      color: #1d1f24;
      font-family: "Inter", sans-serif;
      position: relative;
    }
    .lockup {
      position: absolute;

      top: 60px;
      color: #1d1f24;

    .lockup .mark {
      color: #256b4d;
    }
    h1 {
      position: absolute;
      left: 72px;
      top: 138px;

      line-height: 0.92;

    }
    .lede {
      position: absolute;
      left: 72px;
      top: 318px;
      width: 470px;
      font-size: 23px;

      color: #3a3d44;
    }
    .meta {
      position: absolute;
      left: 72px;
      top: 400px;
      font-size: 17px;
      color: #6b6f78;

    .meta b {

      font-weight: 600;
    }
    .window {
      position: absolute;
      left: 460px;
      top: 440px;
      width: 900px;
      height: 420px;
      border-radius: 14px;
      overflow: hidden;
      background: #fff;

    .bar {
      height: 38px;
      background: #f1f1ee;
      border-bottom: 1px solid #e7e7e4;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 0 14px;
    }
    .bar i {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d6d6d2;
    }
    .shot {
      height: 382px;
      overflow: hidden;
    }
    .window img {
      display: block;
      width: 1278px;
      transform: translate(0, -25px) scale(0.7);
      transform-origin: 0 0;
    }
