<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nota onboarding — prototype</title>
<style>
/* ---------- Nota tokens (packages/ui/src/tokens.css, Forest) ---------- */
:root {
  color-scheme: light dark;
  --app-font: -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI", sans-serif;
  --font-mono: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, "DejaVu Sans Mono", monospace;
  --background: #ffffff; --foreground: #1d1f24; --text: #2a2c31; --text-soft: #3a3d44;
  --muted-foreground: #6b6f78; --faint: #9ca0a8;
  --sidebar: #f7f7f5; --hairline: #e7e7e4; --divider: #efefec; --hover: #ededea; --selected: #e8e8e4;
  --chip: #efefec; --chip-foreground: #4a4d55; --file: #55585f; --code: #f1f1ee; --surface: #ffffff;
  --overlay: rgba(20, 21, 24, 0.28);
  --ink: #256b4d; --ink-soft: #e8f3ee; --ink-soft-hover: #dbede4; --ink-strong: #1d5a40; --ink-foreground: #ffffff;
  --success: #37b26c; --warning: #e2a93b; --danger: #d4483b;
  --shadow-pop: 0 0 0 1px rgba(0,0,0,.06), 0 12px 32px rgba(17,19,24,.12), 0 2px 6px rgba(17,19,24,.06);
  --shadow-card: 0 0 0 1px var(--hairline), 0 1px 2px rgba(0,0,0,.04);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
}
:root[data-theme="light"] { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --background: #1c1c1e; --foreground: #ecebe8; --text: #d9d8d4; --text-soft: #c9c8c4;
    --muted-foreground: #9a9da5; --faint: #6d7078;
    --sidebar: #232325; --hairline: #313134; --divider: #2b2b2e; --hover: #2c2c2f; --selected: #333337;
    --chip: #2e2e32; --chip-foreground: #c4c5ca; --file: #b4b3af; --code: #29292d; --surface: #26262a;
    --overlay: rgba(0,0,0,.5);
    --ink: #5fd3a0; --ink-soft: rgba(95,211,160,.14); --ink-soft-hover: rgba(95,211,160,.22);
    --ink-strong: #9fe6c4; --ink-foreground: #15161a;
    --shadow-pop: 0 0 0 1px rgba(255,255,255,.07), 0 16px 40px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    --shadow-card: 0 0 0 1px var(--hairline), 0 1px 2px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --background: #1c1c1e; --foreground: #ecebe8; --text: #d9d8d4; --text-soft: #c9c8c4;
  --muted-foreground: #9a9da5; --faint: #6d7078;
  --sidebar: #232325; --hairline: #313134; --divider: #2b2b2e; --hover: #2c2c2f; --selected: #333337;
  --chip: #2e2e32; --chip-foreground: #c4c5ca; --file: #b4b3af; --code: #29292d; --surface: #26262a;
  --overlay: rgba(0,0,0,.5);
  --ink: #5fd3a0; --ink-soft: rgba(95,211,160,.14); --ink-soft-hover: rgba(95,211,160,.22);
  --ink-strong: #9fe6c4; --ink-foreground: #15161a;
  --shadow-pop: 0 0 0 1px rgba(255,255,255,.07), 0 16px 40px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --shadow-card: 0 0 0 1px var(--hairline), 0 1px 2px rgba(0,0,0,.2);
}

/* ---------- Harness: the app window ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--background); color: var(--foreground); font: 13px/1.4 var(--app-font);
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; overflow: hidden; }
button { font: inherit; color: inherit; cursor: default; }
.win { position: fixed; inset: 0; display: flex; flex-direction: column; padding-bottom: 56px; }
.titlebar { height: 38px; flex: none; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; }
.tbtn { width: 28px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px;
  background: transparent; color: var(--muted-foreground); transition: background 120ms var(--ease-out), color 120ms var(--ease-out); }
.tbtn:hover { background: var(--hover); color: var(--foreground); }
.tbtn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#stage { flex: 1; min-height: 0; overflow: auto; display: flex; }
.page { margin: auto; padding: 8px 20px 20px; width: 100%; }
.proto-hint { position: fixed; left: 14px; bottom: 14px; font-size: 11px; color: var(--faint); max-width: 300px; line-height: 1.45; pointer-events: none; }
.proto-hint b { color: var(--muted-foreground); font-weight: 500; }

/* ---------- Components ---------- */
svg.i { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
.sub { margin: 6px 0 0; color: var(--muted-foreground); font-size: 13px; line-height: 1.5; }
.card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-card); padding: 28px; }
.lbl { display: block; font-weight: 500; font-size: 12px; color: var(--text-soft); margin-bottom: 6px; }
.lbl small { font-weight: 400; color: var(--faint); margin-left: 4px; }
.input { width: 100%; height: 34px; border: 1px solid var(--hairline); border-radius: 7px; background: var(--background);
  padding: 0 10px; font: inherit; color: var(--foreground); outline: none; user-select: text; -webkit-user-select: text;
  transition: border-color 120ms var(--ease-out), box-shadow 120ms var(--ease-out); }
.input::placeholder { color: var(--faint); }
.input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px var(--ink-soft); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }
.input.mono, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 7px;
  border: 1px solid var(--hairline); background: var(--surface); color: var(--foreground); font-weight: 500; white-space: nowrap;
  transition: transform 160ms var(--ease-out), background 120ms var(--ease-out), opacity 120ms var(--ease-out); }
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(0.97); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn.primary { background: var(--ink); border-color: transparent; color: var(--ink-foreground); }
.btn.primary:hover { background: var(--ink-strong); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted-foreground); }
.btn.ghost:hover { background: var(--hover); color: var(--foreground); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.lg { height: 38px; padding: 0 20px; font-size: 14px; }
.btn[aria-disabled="true"] { opacity: 0.45; }
.btn[aria-disabled="true"]:active { transform: none; }
.msg { margin: 6px 0 0; min-height: 18px; font-size: 12px; line-height: 1.45; color: var(--muted-foreground); display: flex; gap: 6px; align-items: flex-start; }
.msg svg.i { margin-top: 2px; }
.msg:empty { display: none; }
.msg.err { color: var(--danger); }
.msg.ok { color: var(--muted-foreground); }
.msg.ok svg.i { color: var(--ink); }
.pathbox { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; background: var(--code);
  font-family: var(--font-mono); font-size: 12px; color: var(--text-soft); min-height: 34px; }
.pathbox .p { flex: 1; min-width: 0; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
.pathbox.dim { color: var(--faint); }
.pathbox.bad { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 55%, transparent); }
.pathbox svg.i { color: var(--ink); }
.pathbox.bad svg.i { color: var(--danger); }
.pathbox.dim svg.i { color: var(--faint); }
.tag { font-family: var(--app-font); font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--ink-soft); color: var(--ink); white-space: nowrap; }
.radios { display: grid; gap: 8px; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--hairline); border-radius: 10px;
  transition: border-color 120ms var(--ease-out), background 120ms var(--ease-out); }
.radio:hover { background: var(--hover); }
.radio:has(input:checked) { border-color: var(--ink); background: var(--ink-soft); }
.radio:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 2px; }
.radio input { margin: 2px 0 0; accent-color: var(--ink); }
.radio b { display: block; font-weight: 600; font-size: 13px; }
.radio small { display: block; color: var(--muted-foreground); font-size: 12px; margin-top: 1px; }
.seg { display: inline-flex; background: var(--chip); padding: 2px; border-radius: 8px; gap: 2px; }
.seg label { position: relative; padding: 5px 14px; border-radius: 6px; color: var(--muted-foreground); font-weight: 500; transition: background 120ms var(--ease-out), color 120ms var(--ease-out); }
.seg label:has(input:checked) { background: var(--surface); color: var(--foreground); box-shadow: 0 0 0 1px var(--hairline), 0 1px 2px rgba(0,0,0,.06); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--ink); outline-offset: 1px; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { margin: 2px 0 0; accent-color: var(--ink); width: 15px; height: 15px; }
.check b { font-weight: 500; display: block; }
.check small { color: var(--muted-foreground); font-size: 12px; display: block; margin-top: 1px; }
.switch { appearance: none; -webkit-appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--chip); border: 1px solid var(--hairline);
  position: relative; margin: 0; flex: none; transition: background 160ms var(--ease-out); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface);
  box-shadow: 0 0 0 1px var(--hairline); transition: transform 160ms var(--ease-out); }
.switch:checked { background: var(--ink); border-color: transparent; }
.switch:checked::after { transform: translateX(14px); box-shadow: none; }
.switch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--sidebar); font-size: 12.5px; }
.kv dt { color: var(--muted-foreground); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--hairline); border-top-color: var(--ink); animation: spin 800ms linear infinite; flex: none; }
.sync-line { display: flex; align-items: center; gap: 8px; color: var(--muted-foreground); }
.sync-line.on { color: var(--foreground); }
.sync-line svg.i { color: var(--ink); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { from { opacity: 0; transform: scale(0.97); } }
.enter { animation: enter 220ms var(--ease-out) backwards; }
.lockup { display: flex; justify-content: center; margin-bottom: 18px; color: var(--foreground); }
.foot { display: flex; align-items: center; gap: 8px; margin-top: 22px; }
.foot .sp { flex: 1; }
kbd { font: 11px var(--font-mono); padding: 1px 5px; border-radius: 4px; background: var(--chip); color: var(--chip-foreground); }

/* folder picker dialog (fake native sheet) */
.scrim { position: fixed; inset: 38px 0 0 0; background: var(--overlay); display: grid; place-items: center; z-index: 50; animation: fade 140ms var(--ease-out) backwards; }
@keyframes fade { from { opacity: 0; } }
.dialog { width: 440px; max-width: calc(100vw - 32px); background: var(--surface); border-radius: 14px; box-shadow: var(--shadow-pop); overflow: hidden; outline: none; animation: pop 160ms var(--ease-out) backwards; }
.dlg-head { padding: 16px 16px 10px; font-weight: 600; font-size: 14px; }
.dlg-bar { display: flex; align-items: center; gap: 8px; padding: 0 16px 10px; color: var(--muted-foreground); font-size: 12px; }
.dlg-bar .mono { color: var(--text-soft); overflow-wrap: anywhere; }
.flist { margin: 0 12px; height: 188px; overflow: auto; border-radius: 8px; background: var(--background); box-shadow: inset 0 0 0 1px var(--hairline); padding: 4px; }
.frow { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; border: 0; background: transparent; border-radius: 6px; text-align: left; }
.frow svg.i { color: var(--ink); }
.frow[aria-selected="true"] { background: var(--ink-soft); }
.frow .n { flex: 1; }
.frow .meta { color: var(--faint); font-size: 11.5px; }
.fempty { padding: 14px; color: var(--faint); text-align: center; }
.dlg-foot { display: flex; align-items: center; gap: 8px; padding: 12px 16px 16px; }
.dlg-foot .sp { flex: 1; }
.dlg-foot .hint { color: var(--faint); font-size: 11.5px; }

/* ---------- Variant 1: Wizard ---------- */
.v1 { max-width: 460px; }
.v1 .welcome { text-align: center; padding: 36px 32px 30px; }
.v1 .welcome img { width: 84px; height: 84px; display: block; margin: 0 auto 18px; }
.v1 .welcome h1 { font-size: 24px; }
.v1 .welcome .sub { margin: 10px auto 0; max-width: 340px; font-size: 14px; }
.v1 .welcome .btn { margin-top: 24px; }
.v1 .welcome .fine { margin: 14px 0 0; font-size: 12px; color: var(--faint); }
.v1 .fields { display: grid; gap: 12px; margin-top: 16px; }
.v1 .card { padding: 24px; }
.v1 .radios { grid-template-columns: 1fr 1fr; }
.v1 .radio { flex-direction: column; gap: 6px; }
.v1 .radio > span { display: block; }
.v1 .locrow { display: flex; gap: 8px; }
.v1 .openbox { margin-top: 14px; }
.v1 .choose { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 64px; border: 1px dashed var(--hairline);
  border-radius: 10px; background: transparent; color: var(--muted-foreground); font-weight: 500; transition: background 120ms var(--ease-out), border-color 120ms var(--ease-out); }
.v1 .choose:hover { background: var(--hover); border-color: var(--faint); }
.v1 .choose:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.v1 .dots { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; }
.v1 .dots span { width: 6px; height: 6px; border-radius: 999px; background: var(--hairline); transition: width 200ms var(--ease-out), background 200ms var(--ease-out); }
.v1 .dots span.on { width: 18px; background: var(--ink); }
.v1 .dots span.past { background: var(--ink); opacity: .45; }
.v1 .stepcap { text-align: center; margin-top: 8px; font-size: 12px; color: var(--faint); }
.v1 .syncbox { margin-top: 18px; padding: 14px; border-radius: 10px; background: var(--sidebar); display: flex; align-items: center; gap: 12px; }
.v1 .syncbox .sync-line { flex: 1; }

/* ---------- Variant 2: Single form ---------- */
.v2 { max-width: 660px; padding-top: 4px; }
.v2-head { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }
.v2-head img { width: 44px; height: 44px; }
.v2-head .sub { margin-top: 3px; }
.v2 .row { display: grid; grid-template-columns: 132px minmax(0, 1fr); gap: 16px; padding: 14px 0; border-top: 1px solid var(--divider); }
.v2 .row-l b { display: block; font-weight: 600; }
.v2 .row-l span { display: block; color: var(--muted-foreground); font-size: 12px; margin-top: 1px; }
.v2 .grid2 { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 10px; margin-top: 12px; }
.v2 .locrow { display: flex; gap: 8px; }
.v2 .pathrow { margin-top: 10px; }
.v2 .inline { display: flex; align-items: center; gap: 12px; min-height: 32px; }
.v2 .inline .sp { flex: 1; }
.v2 .openrow { display: flex; gap: 8px; margin-top: 12px; }
.v2 .bar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 12px 0 0; margin-top: 2px; border-top: 1px solid var(--divider); background: var(--background); }
.v2 .bar .sum { flex: 1; min-width: 0; color: var(--muted-foreground); font-size: 12px; }
.v2 .bar .sum .mono { color: var(--text-soft); }
.v2 .bar .sum.bad { color: var(--danger); }

/* ---------- Variant 3: Folder-first ---------- */
.v3 { max-width: 560px; text-align: center; }
.v3 .hero img { width: 60px; height: 60px; display: block; margin: 0 auto 14px; }
.v3 h1 { font-size: 26px; }
.v3 .sub { max-width: 440px; margin: 8px auto 0; font-size: 14px; }
.v3 .drop { margin-top: 22px; padding: 24px 16px 20px; border: 1.5px dashed var(--hairline); border-radius: 14px; background: var(--sidebar);
  display: grid; justify-items: center; gap: 4px; color: var(--muted-foreground); transition: border-color 140ms var(--ease-out), background 140ms var(--ease-out); }
.v3 .drop:hover, .v3 .drop.over { border-color: var(--ink); background: var(--ink-soft); }
.v3 .drop:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.v3 .drop svg.i { width: 26px; height: 26px; color: var(--ink); stroke-width: 1.4; margin-bottom: 4px; }
.v3 .drop b { color: var(--foreground); font-weight: 600; font-size: 14px; }
.v3 .drop .or { font-size: 12px; }
.v3 .drop .btn { margin-top: 10px; }
.v3 .pathfield { margin-top: 14px; text-align: left; }
.v3 .detect { text-align: left; margin-top: 10px; min-height: 66px; }
.v3 .detect .res { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--ink-soft); }
.v3 .detect .res svg.i { width: 16px; height: 16px; margin-top: 2px; color: var(--ink); }
.v3 .detect .res b { display: block; font-weight: 600; }
.v3 .detect .res span { color: var(--muted-foreground); font-size: 12px; display: block; margin-top: 1px; }
.v3 .detect .res.bad { background: color-mix(in srgb, var(--danger) 10%, transparent); }
.v3 .detect .res.bad svg.i { color: var(--danger); }
.v3 .go { margin-top: 8px; }
.v3 .setup { text-align: left; }
.v3 .setup h1 { font-size: 22px; }
.v3 .result { display: flex; gap: 12px; padding: 12px 14px; margin-top: 16px; border-radius: 10px; background: var(--ink-soft); align-items: flex-start; }
.v3 .result svg.i { width: 18px; height: 18px; color: var(--ink); margin-top: 1px; }
.v3 .result .t { flex: 1; min-width: 0; }
.v3 .result b { display: block; font-weight: 600; }
.v3 .result .mono { display: block; margin-top: 2px; color: var(--text-soft); overflow-wrap: anywhere; }
.v3 .result .fine { display: block; margin-top: 3px; color: var(--muted-foreground); font-size: 12px; }
.v3 .srows { margin-top: 12px; border-radius: 10px; box-shadow: inset 0 0 0 1px var(--hairline); }
.v3 .srow { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.v3 .srow + .srow { border-top: 1px solid var(--divider); }
.v3 .srow .t { flex: 1; min-width: 0; }
.v3 .srow .t b { font-weight: 500; display: block; }
.v3 .srow .t small { color: var(--muted-foreground); font-size: 12px; display: block; margin-top: 1px; }
.v3 .srow .input { width: 170px; }
.v3 .srow .msgwrap { text-align: right; }
.v3 .srow .msg { justify-content: flex-end; margin-top: 4px; min-height: 0; }
.v3 .setup .foot { margin-top: 18px; }

/* ---------- Opened app (end state) ---------- */
.app { display: grid; grid-template-columns: 230px minmax(0, 1fr); width: 100%; height: 100%; min-height: 400px; }
.app .side { background: var(--sidebar); border-right: 1px solid var(--hairline); padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow: auto; }
.app .vname { font-weight: 600; padding: 4px 8px 10px; display: flex; align-items: center; gap: 8px; }
.app .item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; color: var(--file); }
.app .item.sel { background: var(--selected); color: var(--foreground); }
.app .item svg.i { color: var(--faint); }
.app .item .c { margin-left: auto; color: var(--faint); font-size: 11.5px; }
.app .grow { flex: 1; }
.app .status { padding: 8px; color: var(--muted-foreground); font-size: 12px; display: flex; align-items: center; gap: 6px; }
.app .main { padding: 40px 48px; overflow: auto; }
.app .main h2 { margin: 0 0 10px; font-size: 24px; letter-spacing: -0.02em; }
.app .main p, .app .main li { font-size: 15px; line-height: 1.65; color: var(--text); }
.app .main ul { padding-left: 20px; }
.app .empty { color: var(--faint); font-size: 14px; margin-top: 30vh; text-align: center; }
.app .toast { position: absolute; top: 48px; right: 14px; padding: 8px 12px; border-radius: 8px; background: var(--surface); box-shadow: var(--shadow-pop); display: flex; gap: 8px; align-items: center; font-size: 12.5px; animation: enter 220ms var(--ease-out) backwards; }
.app .toast svg.i { color: var(--ink); }
.restart { position: fixed; right: 14px; bottom: 14px; font-size: 11px; color: var(--faint); background: none; border: 0; padding: 4px 6px; border-radius: 5px; }
.restart:hover { color: var(--foreground); background: var(--hover); }

@media (max-width: 760px) { .v2 .row { grid-template-columns: 1fr; gap: 8px; } .v2 .grid2 { grid-template-columns: 1fr; } .app { grid-template-columns: 1fr; } .app .side { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .enter, .scrim, .dialog, .app .toast { animation: none !important; }
  .spin { animation-duration: 2.4s; }

<script>
(() => {
'use strict';

/* =====================================================================

const ICON = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDI0IiBoZWlnaHQ9IjEwMjQiIHZpZXdCb3g9IjAgMCAxMDI0IDEwMjQiIHJvbGU9ImltZyIgYXJpYS1sYWJlbD0iTm90YSI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImciIHgxPSIwIiB5MT0iMCIgeDI9IjAiIHkyPSIxIj48c3RvcCBvZmZzZXQ9IjAiIHN0b3AtY29sb3I9IiMyZjdkNWIiLz48c3RvcCBvZmZzZXQ9IjEiIHN0b3AtY29sb3I9IiMyMzY2NDkiLz48L2xpbmVhckdyYWRpZW50PgogICAgPGZpbHRlciBpZD0icyIgeD0iLTEyJSIgeT0iLTglIiB3aWR0aD0iMTI0JSIgaGVpZ2h0PSIxMjglIj48ZmVEcm9wU2hhZG93IGR4PSIwIiBkeT0iMTQiIHN0ZERldmlhdGlvbj0iMTYiIGZsb29kLWNvbG9yPSIjMDAwIiBmbG9vZC1vcGFjaXR5PSIuMjYiLz48L2ZpbHRlcj4KICA8L2RlZnM+CiAgPHJlY3QgeD0iMTAwIiB5PSIxMDAiIHdpZHRoPSI4MjQiIGhlaWdodD0iODI0IiByeD0iMTg1IiBmaWxsPSJ1cmwoI2cpIiBmaWx0ZXI9InVybCgjcykiLz4KICA8cGF0aCBkPSJNMzQ2IDY4OFYzNTZMNjE0IDY2OCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9Ijk2IiBzdHJva2UtbGluZWNhcD0icm91bmQiIHN0cm9rZS1saW5lam9pbj0icm91bmQiLz4KICA8cGF0aCBkPSJNNjYxLjIgNjc2LjZMNzMxLjggMjg5LjhBMTAgMTAgMCAwIDAgNzEyLjcgMjg0LjRMNTY5LjMgNjUwLjVBNDggNDggMCAxIDAgNjYxLjIgNjc2LjZaIiBmaWxsPSIjZmZmIi8+CiAgPHJlY3QgeD0iMTAxLjUiIHk9IjEwMS41IiB3aWR0aD0iODIxIiBoZWlnaHQ9IjgyMSIgcng9IjE4My41IiBmaWxsPSJub25lIiBzdHJva2U9IiNmZmYiIHN0cm9rZS1vcGFjaXR5PSIuMTIiIHN0cm9rZS13aWR0aD0iMyIvPgo8L3N2Zz4K';

const lockup = (h) => `<svg role="img" aria-label="Nota" viewBox="0 0 216 64" height="${h}" width="${h * 216 / 64}"><g transform="scale(2)" style="color:var(--ink)"><path d="${MARK_N}" fill="none" stroke="currentColor" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/><path d="${MARK_TICK}" fill="currentColor"/></g><path transform="translate(78 7) scale(.8)" d="${WORD}" fill="none" stroke="currentColor" stroke-width="8"/></svg>`;

const ICONS = {

  folderPlus: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  alert: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/>',
  doc: '<path d="M7 3h7l4 4v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
  up: '<path d="M15 18l-6-6 6-6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',
  inbox: '<path d="M4 13l2.5-7h11L20 13v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5l1 2.5h5l1-2.5H20"/>',
  cloud: '<path d="M7 18a4 4 0 0 1-.6-7.95A5.5 5.5 0 0 1 17 9.5 4.3 4.3 0 0 1 17 18z"/>',
};
const ic = (n) => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =====================================================================
   A fake file system: just enough to make every state reachable.
   ===================================================================== */
const D = (kids, o) => ({ kids: kids || {}, notes: (o && o.notes) || 0, other: (o && o.other) || 0 });
const HOME = D({
  Desktop: D({ Screenshots: D({}, { other: 14 }) }),
  Documents: D({
    Archive: D(),
    Recipes: D({}, { other: 7 }),
    Work: D({ Reports: D({}, { notes: 12 }) }, { notes: 26, other: 4 }),
    Writing: D({ Drafts: D({}, { notes: 31 }) }, { notes: 93, other: 9 }),
  }),
  Downloads: D(),
  Projects: D({ docs: D({}, { notes: 38, other: 3 }) }),
});
const norm = (p) => { p = (p || '').trim().replace(/\\/g, '/').replace(/\/{2,}/g, '/'); if (p.length > 1) p = p.replace(/\/+$/, ''); return p; };
const segs = (p) => p.split('/').filter(Boolean);
const lastSeg = (p) => { const s = segs(p); return s[s.length - 1] || p; };
const parentOf = (p) => { const s = segs(p); s.pop(); return (p.startsWith('/') ? '/' : '') + s.join('/'); };
function lookup(p) {
  p = norm(p);
  if (p !== '~' && !p.startsWith('~/')) return null;
  let n = HOME;
  for (const s of segs(p).slice(1)) {
    const k = Object.keys(n.kids).find((x) => x.toLowerCase() === s.toLowerCase());
    if (!k) return null;
    n = n.kids[k];
  }
  return n;
}
const total = (n) => Object.values(n.kids).reduce((a, k) => { const t = total(k); return { notes: a.notes + t.notes, other: a.other + t.other, dirs: a.dirs + 1 + t.dirs }; }, { notes: n.notes, other: n.other, dirs: 0 });
const isEmpty = (n) => { const t = total(n); return !t.notes && !t.other && !t.dirs; };
const forbidden = (p) => p === '/' || /^\/(system|usr|bin|sbin|applications|library|etc|private|var)(\/|$)/i.test(p);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

const BAD = /[\\\/:*?"<>|\u0000-\u001f]/g;
function nameError(raw, kind) {
  const n = (raw || '').normalize('NFC').trim();
  if (!n) return kind === 'inbox' ? 'Give the folder a name, or skip to use “Inbox”.' : 'Give the vault a name.';
  const bad = [...new Set(n.match(BAD) || [])];
  if (bad.some((c) => c === '/' || c === '\\')) {
    return kind === 'inbox' ? 'Use a single folder name, without slashes.' : 'A name can’t contain slashes. Use Location to choose where it goes.';
  }
  if (bad.length) return `A name can’t contain ${bad.filter((c) => c >= ' ').map((c) => '“' + c + '”').join(' ') || 'control characters'}.`;
  if (n.startsWith('.')) return 'A name can’t start with a dot, because the folder would be hidden.';
  if (/[. ]$/.test(n)) return 'A name can’t end with a dot.';
  if (/^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$/i.test(n)) return `“${n}” is reserved by the operating system.`;
  if (n.length > 100) return 'That name is too long (100 characters at most).';
  return '';
}
function locError(raw) {
  const lp = norm(raw);
  if (!lp) return 'Choose where the vault should be created.';
  if (!lp.startsWith('~') && !lp.startsWith('/')) return 'Use a full path, starting with ~ or /.';
  if (forbidden(lp)) return `Nota can’t write to “${lp}”. Pick a folder inside your home folder.`;
  return '';
}

/* ---------- derived state: explicit mode (variants 1 and 2) ---------- */
function deriveForm(S) {
  const d = { ok: false, kind: null, vault: '', vname: '', notes: 0, other: 0, nameErr: '', locErr: '', locNote: '', conflict: null, canWelcome: false };
  d.inboxErr = nameError(S.inbox, 'inbox');
  if (S.mode === 'create') {
    const nm = S.name.normalize('NFC').trim();
    const lp = norm(S.loc);
    d.nameErr = nameError(nm, 'vault');
    d.locErr = locError(lp);
    if (!d.locErr && lp.startsWith('~') && !lookup(lp)) d.locNote = 'This folder doesn’t exist yet, so Nota will create it too.';
    if (!d.nameErr && !d.locErr) {
      const full = lp + '/' + nm;
      const node = lookup(full);
      d.vault = full; d.vname = nm;
      if (!node) { d.kind = 'new'; d.ok = true; }
      else if (isEmpty(node)) { d.kind = 'empty'; d.ok = true; }
      else { const t = total(node); d.conflict = { path: full, notes: t.notes, other: t.other }; }
    }
  } else if (S.existing) {
    const node = lookup(S.existing) || D();
    const t = total(node);
    Object.assign(d, { ok: true, vault: S.existing, vname: lastSeg(S.existing), notes: t.notes, other: t.other, kind: isEmpty(node) ? 'empty' : 'existing' });
  }
  d.canWelcome = d.ok && (d.kind === 'new' || d.kind === 'empty');
  return d;
}
/* ---------- derived state: one path field decides everything (variant 3) ---------- */
function derivePath(S) {
  const d = { ok: false, kind: null, vault: '', vname: '', notes: 0, other: 0, pathErr: '', pathNote: '', canWelcome: false };
  d.inboxErr = nameError(S.inbox, 'inbox');
  const p = norm(S.path);
  if (!p) d.pathErr = 'Enter a folder path, or pick one.';
  else if (!p.startsWith('~') && !p.startsWith('/')) d.pathErr = 'Use a full path, starting with ~ or /.';
  else if (forbidden(p)) d.pathErr = `Nota can’t write to “${p}”. Pick a folder inside your home folder.`;
  else {
    const node = lookup(p);
    if (node) {
      const t = total(node);
      Object.assign(d, { ok: true, vault: p, vname: lastSeg(p), notes: t.notes, other: t.other, kind: isEmpty(node) ? 'empty' : 'existing' });
    } else {
      const nm = lastSeg(p);
      const e = nameError(nm, 'vault');
      if (e) d.pathErr = e;
      else {
        Object.assign(d, { ok: true, vault: p, vname: nm, kind: 'new' });
        const par = parentOf(p);
        if (par.startsWith('~') && par !== '~' && !lookup(par)) d.pathNote = `It will also create ${par}.`;
      }
    }
  }
  d.canWelcome = d.ok && (d.kind === 'new' || d.kind === 'empty');
  return d;
}

/* =====================================================================
   Shared view bits
   ===================================================================== */
const msg = (txt, cls) => txt ? `<p class="msg ${cls || ''}">${cls === 'err' ? ic('alert') : cls === 'ok' ? ic('check') : ''}<span>${esc(txt)}</span></p>` : '<p class="msg"></p>';
const showErr = (S, k) => !!(S.touched[k] || S.touched.all);

function notesLine(d) {
  if (d.kind === 'empty' && !d.other) return 'The folder is empty. Nota will use it as is.';
  if (d.notes) return `Found ${plural(d.notes, 'note')} (.md files). Nothing is moved or rewritten; Nota only adds a .nota folder for its index.`;
  return 'No Markdown notes found yet. Nothing is moved or rewritten; Nota only adds a .nota folder for its index.';
}

const SHARED = {
  nameMsg: (S, d) => (showErr(S, 'name') && d.nameErr) ? msg(d.nameErr, 'err') : msg(''),
  locMsg: (S, d) => d.locErr ? (showErr(S, 'loc') ? msg(d.locErr, 'err') : msg('')) : msg(d.locNote),
  preview(S, d) {
    if (S.mode !== 'create') return '';
    if (d.conflict) {
      const c = d.conflict;
      return `<div class="pathbox bad">${ic('alert')}<span class="p">${esc(c.path)}</span></div>
        <p class="msg err">${ic('alert')}<span>A folder named “${esc(lastSeg(c.path))}” already exists here and isn’t empty${c.notes ? ` (${plural(c.notes, 'note')})` : ''}.</span></p>
        <div style="margin-top:8px"><button class="btn sm" type="button" data-act="use-existing" data-f="use-existing">Use existing folder instead</button></div>`;
    }
    if (!d.ok) return `<div class="pathbox dim">${ic('folder')}<span class="p">${esc(norm(S.loc) || '…')}/${esc(S.name.trim() || '…')}</span></div>`;
    return `<div class="pathbox">${ic('folder')}<span class="p">${esc(d.vault)}</span><span class="tag">${d.kind === 'empty' ? 'Empty folder' : 'New folder'}</span></div>`;
  },
  openResult(S, d) {
    if (S.mode !== 'open') return '';
    if (!S.existing) return showErr(S, 'existing') ? msg('Choose a folder to continue.', 'err') : msg('');
    return `<div class="pathbox">${ic('folder')}<span class="p">${esc(S.existing)}</span></div>${msg(notesLine(d), 'ok')}`;
  },
  inboxMsg(S, d) {
    if (d.inboxErr && showErr(S, 'inbox')) return msg(d.inboxErr, 'err');
    return `<p class="msg">${d.ok ? `Captures are saved in ${esc(d.vault)}/${esc(S.inbox.trim() || '…')}/` : 'A folder inside your vault where quick captures land.'}</p>`;
  },
  modal(S) {
    const m = S.modal;
    if (!m) return '';
    const node = lookup(m.cwd) || D();
    const kids = Object.keys(node.kids).sort((a, b) => a.localeCompare(b));
    const showCounts = m.kind !== 'loc';
    const rows = kids.length ? kids.map((k) => {
      const p = m.cwd + '/' + k; const t = total(node.kids[k]);
      return `<button class="frow" type="button" role="option" tabindex="-1" data-act="m-row" data-path="${esc(p)}" aria-selected="${m.sel === p}">${ic('folder')}<span class="n">${esc(k)}</span>${showCounts && t.notes ? `<span class="meta">${plural(t.notes, 'note')}</span>` : ''}</button>`;
    }).join('') : '<div class="fempty">No folders here</div>';
    const target = m.sel || m.cwd;
    const title = m.kind === 'loc' ? 'Choose a location' : m.kind === 'existing' ? 'Choose a folder to open' : 'Choose a folder';
    return `<div class="scrim"><div class="dialog" role="dialog" aria-modal="true" aria-label="${title}" tabindex="-1">
      <div class="dlg-head">${title}</div>
      <div class="dlg-bar"><button class="btn sm" type="button" data-act="m-up" aria-label="Up one folder"${m.cwd === '~' ? ' aria-disabled="true"' : ''}>${ic('up')}</button><span class="mono">${esc(m.cwd)}</span></div>
      <div class="flist" role="listbox" aria-label="Folders">${rows}</div>
      <div class="dlg-foot"><span class="hint">↑↓ select · → open · ← up</span><span class="sp"></span>
        <button class="btn" type="button" data-act="m-cancel">Cancel</button>
        <button class="btn primary" type="button" data-act="m-choose">Choose “${esc(lastSeg(target))}”</button></div>
    </div></div>`;
  },
};

function syncPieces(S) {
  if (S.sync === 'waiting') return { text: `<span class="sync-line"><span class="spin" aria-hidden="true"></span>Finish signing in in your browser…</span>`, btn: `<button class="btn" type="button" data-act="cancel-signin" data-f="signin">Cancel</button>` };
  if (S.sync === 'done') return { text: `<span class="sync-line on">${ic('check')}Signed in as ${esc(S.email)}</span>`, btn: `<button class="btn ghost" type="button" data-act="signout" data-f="signin">Sign out</button>` };
  return { text: `<span class="sync-line">${ic('cloud')}Not signed in</span>`, btn: `<button class="btn" type="button" data-act="signin" data-f="signin">Sign in to sync</button>` };
}

function appView(S, d) {
  const notes = ['Meeting notes', 'Reading list', 'Ideas', 'Trip plan', 'Book summary'];
  const existing = d.kind === 'existing' || (d.kind === 'empty' && d.other);
  const welcomeOn = d.canWelcome && S.welcome;
  const inbox = S.inbox.trim() || 'Inbox';
  const tree = [
    `<div class="item">${ic('inbox')}${esc(inbox)}<span class="c">0</span></div>`,
    welcomeOn ? `<div class="item sel">${ic('doc')}Welcome</div>` : '',
    d.kind === 'existing' ? notes.slice(0, Math.min(5, d.notes)).map((n) => `<div class="item">${ic('doc')}${n}</div>`).join('') + (d.notes > 5 ? `<div class="item" style="color:var(--faint)">…and ${d.notes - 5} more</div>` : '') : '',
  ].join('');
  const main = welcomeOn
    ? `<h2>Welcome to Nota</h2><p>Every note here is a Markdown file in <span class="mono">${esc(d.vault)}</span>. Edit them in Nota or in any other editor.</p>
       <ul><li>Press ⌘K to search and jump to any note.</li><li>Press ⌃⌥N to capture a thought into ${esc(inbox)}.</li><li>Link notes with [[double brackets]] and organise with #tags.</li></ul>`
    : `<div class="empty">No note open. Press ⌘N to start one.</div>`;
  return `<div class="app enter" style="position:relative"><aside class="side"><div class="vname">${ic('folder')}${esc(d.vname)}</div>${tree}<div class="grow"></div>
    <div class="status">${S.sync === 'done' ? ic('cloud') + 'Synced · ' + esc(S.email) : ic('cloud') + 'Local only'}</div></aside>
    <section class="main">${main}</section>
    <div class="toast">${ic('check')}${d.kind === 'new' ? 'Created' : 'Opened'} ${esc(d.vault)}</div></div>
    <button class="restart" type="button" data-act="restart">Restart onboarding</button>`;
}

/* =====================================================================
   Variant 1 · Wizard: one decision per screen, linear
   ===================================================================== */
const STEPS1 = ['welcome', 'vault', 'inbox', 'sync', 'done'];
const LABEL1 = { vault: 'Vault', inbox: 'Inbox', sync: 'Sync', done: 'Done' };
const V1 = {
  hint: 'Try the name <b>a/b</b>, <b>.hidden</b> or <b>CON</b>; <b>Writing</b> exists with 124 notes; <b>Archive</b> is empty. ↵ continues, Esc goes back.',
  steps: STEPS1,
  derive: deriveForm,
  init: () => mkState({ step: 'welcome' }),
  canNext(S, d) {
    if (S.step === 'vault') return d.ok;
    if (S.step === 'inbox') return !d.inboxErr;
    if (S.step === 'sync') return S.sync !== 'waiting';
    return true;
  },
  regions: Object.assign({}, SHARED, {
    syncBody(S) { const p = syncPieces(S); return `<div class="syncbox">${p.text}${p.btn}</div>`; },
    nav(S, d) {
      const ok = V1.canNext(S, d); const dis = ok ? '' : ' aria-disabled="true"';

/* =====================================================================
   Engine
   ===================================================================== */
const stage = document.getElementById('stage');
const hintEl = document.getElementById('hint');
const defs = [V1, V2, V3];
let cur = defs[0];
let S = null;
let d = null;

function mkState(extra) {
  return Object.assign({ step: '', mode: 'create', name: 'Notes', loc: '~/Documents', existing: '', path: '~/Documents/Notes', inbox: 'Inbox',
    welcome: true, sync: 'idle', email: 'you@example.com', modal: null, touched: {}, anim: true, dropErr: '', returnF: '' }, extra);
}

function repaint() {
  if (!S) return;
  d = cur.derive(S);
  const active = document.activeElement;
  const af = active && active.dataset ? active.dataset.f : '';
  stage.querySelectorAll('[data-region]').forEach((el) => {
    const fn = cur.regions[el.dataset.region];
    const html = fn ? fn(S, d) : '';
    if (el._h !== html) { el.innerHTML = html; el._h = html; }
  });
  stage.querySelectorAll('[data-invalid]').forEach((el) => {
    const k = el.dataset.invalid;
    const err = k === 'name' ? d.nameErr : k === 'loc' ? d.locErr : k === 'inbox' ? d.inboxErr : k === 'path' ? d.pathErr : '';
    el.setAttribute('aria-invalid', err && showErr(S, k) ? 'true' : 'false');
  });

  if (dlg && !dlg.contains(document.activeElement)) dlg.focus({ preventScroll: true });
  else if (af && (!document.activeElement || document.activeElement === document.body)) {
    const t = stage.querySelector(`[data-f="${af}"]`);
    if (t) t.focus({ preventScroll: true });
  }
  if (!dlg && S.returnF) { const t = stage.querySelector(`[data-f="${S.returnF}"]`); S.returnF = ''; if (t) t.focus({ preventScroll: true }); }
  hintEl.innerHTML = S.step === 'opened' ? '' : cur.hint;
}

function rerender(enter) {
  const a = document.activeElement;
  const f = a && a.dataset ? a.dataset.f : '';
  const sel = a && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  S.anim = !!enter;
  stage.innerHTML = cur.view(S, cur.derive(S));
  repaint();
  let t = enter ? stage.querySelector('[data-autofocus]') : (f ? stage.querySelector(`[data-f="${f}"]`) : null);
  if (t && !stage.querySelector('.dialog')) {
    t.focus({ preventScroll: true });
    if (!enter && sel && t.setSelectionRange) { try { t.setSelectionRange(sel[0], sel[1]); } catch (_) { /* not a text input */ } }
  }

}

function setField(k, v) { S[k] = v; const el = stage.querySelector(`[data-in="${k}"]`); if (el && el.value !== v) el.value = v; }

function openModal(kind) {
  const af = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.f : '';
  S.returnF = af || '';
  const start = kind === 'loc' ? norm(S.loc) : kind === 'existing' ? (S.existing ? parentOf(S.existing) : '~/Documents') : (lookup(norm(S.path)) ? parentOf(norm(S.path)) : '~/Documents');
  const cwd = lookup(start) && start.startsWith('~') ? start : '~/Documents';
  S.modal = { kind, cwd, sel: null };
  repaint();
}
function modalChoose() {
  const m = S.modal; const p = m.sel || m.cwd;
  S.modal = null;
  if (m.kind === 'loc') { setField('loc', p); S.touched.loc = true; }
  else if (m.kind === 'existing') { S.existing = p; S.touched.existing = true; }
  else { setField('path', p); S.touched.path = true; S.dropErr = ''; }
  if (m.kind === 'existing') rerender(false); else repaint();
}
function modalRows() { const n = lookup(S.modal.cwd) || D(); return Object.keys(n.kids).sort((a, b) => a.localeCompare(b)).map((k) => S.modal.cwd + '/' + k); }

let signInTimer = 0;
function act(name, el) {
  if (name === 'next' || name === 'finish') {
    if (!cur.canNext(S, d)) { S.touched.all = true; repaint(); return; }
    if (name === 'finish') { S.step = 'opened'; rerender(true); return; }
    const i = cur.steps.indexOf(S.step);
    S.step = cur.steps[Math.min(i + 1, cur.steps.length - 1)];
    rerender(true);
  } else if (name === 'back') {
    const i = cur.steps.indexOf(S.step);
    if (i > 0) { S.step = cur.steps[i - 1]; rerender(true); }
  } else if (name === 'skip-inbox') { S.inbox = 'Inbox'; S.step = cur.steps[cur.steps.indexOf(S.step) + 1]; rerender(true); }
  else if (name === 'choose-loc') openModal('loc');
  else if (name === 'choose-existing') openModal('existing');
  else if (name === 'choose-path') openModal('path');
  else if (name === 'use-existing') { S.mode = 'open'; S.existing = d.conflict.path; S.touched.existing = true; rerender(false); }
  else if (name === 'signin') {
    S.sync = 'waiting'; repaint();
    const mine = S;
    clearTimeout(signInTimer);
    signInTimer = setTimeout(() => {
      if (S !== mine || S.sync !== 'waiting') return;
      S.sync = 'done'; repaint();
      // Signed in: Enter should now mean "continue", so hand focus to the primary action.
      const a = document.activeElement; const pr = stage.querySelector('[data-primary]');
      if (pr && (!a || a === document.body || (a.dataset && a.dataset.f === 'signin'))) pr.focus({ preventScroll: true });
    }, 1600);
  } else if (name === 'cancel-signin') { clearTimeout(signInTimer); S.sync = 'idle'; repaint(); }
  else if (name === 'signout') { S.sync = 'idle'; repaint(); }
  else if (name === 'restart') mount(current);
  else if (name === 'm-cancel') { S.modal = null; repaint(); }
  else if (name === 'm-choose') modalChoose();
  else if (name === 'm-up') { if (S.modal.cwd !== '~') { S.modal.cwd = parentOf(S.modal.cwd) || '~'; S.modal.sel = null; repaint(); } }
  else if (name === 'm-row') { S.modal.sel = el.dataset.path; repaint(); }
}

stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (el) act(el.dataset.act, el);
});
stage.addEventListener('dblclick', (e) => {
  const el = e.target.closest('[data-act="m-row"]');
  if (el && S.modal) { S.modal.cwd = el.dataset.path; S.modal.sel = null; repaint(); }
});
stage.addEventListener('input', (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (!k || e.target.type === 'checkbox' || e.target.type === 'radio') return;
  S[k] = e.target.value; S.touched[k] = true; if (k === 'path') S.dropErr = '';
  repaint();
});
stage.addEventListener('change', (e) => {
  const k = e.target.dataset && e.target.dataset.in;
  if (k === 'mode') { S.mode = e.target.value; rerender(false); }
  else if (k === 'welcome') { S.welcome = e.target.checked; repaint(); }
});
stage.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.act === 'choose-path') { e.preventDefault(); act('choose-path'); }
  if (e.key === ' ' && e.target.dataset && e.target.dataset.act === 'choose-path') { e.preventDefault(); act('choose-path'); }
});

/* drag and drop (variant 3): reads the real folder name and counts .md files */
stage.addEventListener('dragover', (e) => { const z = e.target.closest('.drop'); if (z) { e.preventDefault(); z.classList.add('over'); } });
stage.addEventListener('dragleave', (e) => { const z = e.target.closest('.drop'); if (z) z.classList.remove('over'); });
function walk(entry, acc, budget) {
  return new Promise((resolve) => {
    if (budget.n-- <= 0) return resolve();
    if (entry.isFile) { if (/\.md$/i.test(entry.name)) acc.notes++; else acc.other++; return resolve(); }
    const r = entry.createReader(); const all = [];
    const pump = () => r.readEntries(async (list) => {
      if (!list.length) { for (const c of all) await walk(c, acc, budget); return resolve(); }
      all.push(...list); pump();
    }, () => resolve());
    pump();
  });
}
stage.addEventListener('drop', async (e) => {
  const z = e.target.closest('.drop'); if (!z) return;
  e.preventDefault(); z.classList.remove('over');
  const item = e.dataTransfer && e.dataTransfer.items && e.dataTransfer.items[0];
  const entry = item && item.webkitGetAsEntry && item.webkitGetAsEntry();
  if (!entry || !entry.isDirectory) { S.dropErr = 'That’s a file. Drop a folder instead.'; repaint(); return; }
  const acc = { notes: 0, other: 0 };
  await walk(entry, acc, { n: 5000 });
  const nm = entry.name;
  HOME.kids.Documents.kids[nm] = D({}, acc); // the browser hides real paths, so the prototype files it under ~/Documents
  S.dropErr = ''; S.touched.path = true; setField('path', '~/Documents/' + nm);
  repaint();
});

/* keys: Enter advances, Esc goes back / closes the sheet. Registered before the picker's. */
document.addEventListener('keydown', (e) => {
  if (!S || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.modal) {
    const rows = modalRows(); const i = rows.indexOf(S.modal.sel);
    let used = true;
    if (e.key === 'Escape') act('m-cancel');
    else if (e.key === 'Enter') modalChoose();
    else if (e.key === 'ArrowDown') { S.modal.sel = rows[Math.min(i + 1, rows.length - 1)] || null; repaint(); }
    else if (e.key === 'ArrowUp') { S.modal.sel = i > 0 ? rows[i - 1] : rows[0] || null; repaint(); }
    else if (e.key === 'ArrowRight') { if (S.modal.sel) { S.modal.cwd = S.modal.sel; S.modal.sel = null; repaint(); } }
    else if (e.key === 'ArrowLeft' || e.key === 'Backspace') act('m-up');
    else used = false;
    if (used) { e.preventDefault(); e.stopImmediatePropagation(); }
    else if (e.target.tagName === 'BUTTON' && e.key === ' ') { /* let the focused button click */ }
    return;
  }
  const t = e.target;
  if (e.key === 'Enter') {
    if (t.tagName === 'BUTTON' || t.tagName === 'A' || (t.dataset && t.dataset.act)) return;
    const p = stage.querySelector('[data-primary]');
    if (p) { e.preventDefault(); act(p.dataset.act, p); }
  } else if (e.key === 'Escape') {
    const b = stage.querySelector('[data-back]');
    if (b) { e.preventDefault(); act('back', b); }
  }
});

/* theme toggle: system → light → dark */
const themeBtn = document.getElementById('theme');
const THEMES = ['system', 'light', 'dark'];
let themeNow = 'system';
try { themeNow = localStorage.getItem('nota:theme') || 'system'; } catch (_) { /* storage blocked */ }
function applyTheme() {
  if (themeNow === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = themeNow;
  const label = `Theme: ${themeNow[0].toUpperCase() + themeNow.slice(1)}`;
  themeBtn.setAttribute('aria-label', label); themeBtn.title = label + ' (click to change)';
  themeBtn.innerHTML = ic(themeNow === 'system' ? 'auto' : themeNow === 'light' ? 'sun' : 'moon');
  try { if (themeNow === 'system') localStorage.removeItem('nota:theme'); else localStorage.setItem('nota:theme', themeNow); } catch (_) { /* ignore */ }
}
themeBtn.addEventListener('click', () => { themeNow = THEMES[(THEMES.indexOf(themeNow) + 1) % 3]; applyTheme(); });
applyTheme();

/* =====================================================================
   Picker wiring (PICKER.md reference), variants are render functions
   ===================================================================== */
const variants = defs.map((def) => () => {
  clearTimeout(signInTimer);
  cur = def; S = def.init(); d = def.derive(S);
  queueMicrotask(() => { repaint(); });
  return def.view(S, d);
});
window.__variants = variants;
window.__proto = { get S() { return S; }, get d() { return d; }, HOME };

const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}
function mount(i) {
  stage.innerHTML = '';
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
})();
</script>
