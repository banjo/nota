# The gate every change to main and build/v1 passes: formatting, lint and
# type checks, the frontend and Go tests, and the site build.
name: CI

on:
  push:
    branches: [main, build/v1]
  pull_request:
    branches: [main, build/v1]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "::error::gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: vp check
        run: bunx vp check
      - name: Frontend tests
        run: bunx vp run -r test
      - name: Site build
        env:
          # The landing reads the latest release at build time; the token
          # only lifts the API rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf dist
          bunx vp run site:build
          test -f dist/index.html && test -f dist/app/index.html && test -f dist/_worker.js
